#
# On every push and pull request: lint and a debug build.
# On push to main, the debug APK is published to the ci-debug prerelease.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and debug build
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: Publish debug APK to ci-debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create ci-debug --prerelease --title "CI debug build" --notes "Debug APK built by CI on every push to main." --repo "$GITHUB_REPOSITORY"
          gh release upload ci-debug --clobber app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY"
