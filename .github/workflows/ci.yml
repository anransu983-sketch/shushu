#
# On every push and pull request: lint and a debug build.
# On push to main, the debug APK is published to the ci-debug prerelease, and a
# versioned release (v<versionName>) with the APK and a release.json, so the
# in-app update check (which reads releases/latest/download/release.json) works.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and debug build
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: Publish debug APK to ci-debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create ci-debug --prerelease --title "CI debug build" --notes "Debug APK built by CI on every push to main." --repo "$GITHUB_REPOSITORY"
          gh release upload ci-debug --clobber app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY"
      - name: Publish versioned release with update manifest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/[^"]*"//;s/".*//')
          TAG="v$VERSION"
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s)
          python3 - "$TAG" "$VERSION" "$SIZE" "$SHA" "$NOTES" <<'PY'
          import json, sys
          tag, version, size, sha, notes = sys.argv[1:6]
          manifest = {
              "tag": tag,
              "version_name": version,
              "apk": "app-debug.apk",
              "size_bytes": int(size),
              "sha256": sha,
              "package": "com.suanran.shushu",
              "release_notes": {"en": notes, "zh": notes},
          }
          with open("release.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --title "Shushu $VERSION" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" --clobber "$APK" release.json --repo "$GITHUB_REPOSITORY"
